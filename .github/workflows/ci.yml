jobs:
  python:
    name: Python – ruff + pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install -U pip
          pip install ruff pytest
      - name: Lint with ruff
        run: ruff check backend/analytics-worker
      - name: Run unit tests
        run: pytest backend/analytics-worker/tests

