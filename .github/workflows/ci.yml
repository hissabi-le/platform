name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ruff
        run: pip install ruff
      - name: Lint backend
        run: |
          ruff check backend/api/src --select=E,F --ignore=E501,F401,F841 || true
          ruff check backend/analytics-worker/src --select=E,F --ignore=E501,F401,F841 || true

  lint-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: web-app/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: web-app
      - name: Lint frontend
        run: pnpm lint || true
        working-directory: web-app

  build-frontend:
    runs-on: ubuntu-latest
    needs: lint-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: web-app/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: web-app
      - name: Build
        run: pnpm build
        working-directory: web-app
        env:
          NEXT_PUBLIC_API_BASE_URL: https://api.example.com

  test-backend:
    runs-on: ubuntu-latest
    needs: lint-backend
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: hissabi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install API dependencies
        run: |
          pip install -U pip
          pip install -e .
          pip install pytest pytest-asyncio httpx openai psycopg[binary]
        working-directory: backend/api
      - name: Install analytics-worker dependencies
        run: |
          pip install -U pip
          pip install -e .
          pip install pytest pytest-asyncio
        working-directory: backend/analytics-worker
      - name: Run migrations
        run: alembic upgrade head
        working-directory: backend/api
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/hissabi_test
      - name: Run API tests
        run: pytest tests/ -v --ignore=tests/test_integration.py || true
        working-directory: backend/api
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/hissabi_test
          REDIS_URL: redis://localhost:6379
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          JWT_SECRET: test-secret-key-for-ci
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          S3_BUCKET_NAME: test-bucket
