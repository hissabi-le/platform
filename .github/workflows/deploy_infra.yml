name: Deploy Infrastructure
on:
  push:
    branches:
      - main

jobs:
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v1
        with:
          terraform_version: 1.5.0

      - name: Terraform Init
        working-directory: infra/terraform
        run: terraform init

      - name: Terraform Plan
        id: plan
        working-directory: infra/terraform
        run: terraform plan -out=plan.out -var="do_token=${{ secrets.DO_TOKEN }}"

      - name: Terraform Apply
        working-directory: infra/terraform
        if: success()
        run: terraform apply plan.out

      - name: Capture Outputs
        working-directory: infra/terraform
        id: outputs
        run: |
          echo "::set-output name=api_ip::$(terraform output -raw api_ip)"
          echo "::set-output name=db_uri::$(terraform output -raw db_uri)"
