# backend/analytics-worker/pyproject.toml

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "analytics-worker"
version = "0.1.0"
description = "Celery worker handling offline analytics + inventory crunching."
requires-python = ">=3.12"
dependencies = [
    "celery[redis]>=5.3",
    "redis>=5.0",
    "sqlalchemy>=2.0",
    "asyncpg>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
]

[project.optional-dependencies]
test = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["analytics_worker*"]

[tool.setuptools.package-dir]
"" = "src"

[tool.ruff]
line-length = 88
src = ["src"]
