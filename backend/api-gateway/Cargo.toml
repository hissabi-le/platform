[package]
name = "api-gateway"
version = "0.1.0"
edition = "2024"

[dependencies]

axum = "0.6"               # HTTP server framework
tokio = { version = "1", features = ["full"] }  # async runtime
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"         # JSON serialization
tower-http = { version = "0.3", features = ["cors"] }  # CORS, tracing, etc.
