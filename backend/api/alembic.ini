# alembic.ini

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s

[alembic]
# path to migration scripts
script_location = alembic

# use the DATABASE_URL environment variable at runtime
sqlalchemy.url = ${DATABASE_URL}

# optional: specify the DB dialect if needed
# dialect = postgresql

[post_write_hooks]
# you can define hooks here if desired
