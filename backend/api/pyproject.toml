[project]
name = "api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.95.0",
  "uvicorn[standard]>=0.23.0",
  "sqlalchemy>=2.0.0",
  "asyncpg",
  "alembic",
  "pydantic-settings>=2.2.1",
  "boto3>=1.34.0",
  "stripe",
  "passlib[bcrypt]>=1.7.4",
  "argon2-cffi>=21.3.0",
  "redis>=5.0.0",
  "clamd>=1.0.2",
  "dramatiq[redis]>=1.15.0",
  "pyjwt>=2.9.0",
  "httpx<0.28",
  "email-validator>=2.0.0",
  "gunicorn>=22.0.0",
  "python-multipart>=0.0.6",
  "openpyxl>=3.1.0",
  "greenlet",
  "openai>=1.0.0",
  "bcrypt==4.0.1",
  "psycopg>=3.3.2",
  "python-json-logger>=2.0.7",
