services:
  api:
    build:
      context: ./backend/api
      dockerfile: Dockerfile
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend/api/src:/app/src
      - ./backend/api/alembic:/app/alembic
      - ./backend/api/tests:/app/tests
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    environment:
      # point at the 'db' service in this compose file
      - DATABASE_URL=postgresql+asyncpg://postgres:secret@db:5432/postgres
      # ensure your stripe & secret envs are set, too
      - SECRET=${SECRET:-changeme}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}

  worker:
    build:
      context: ./backend/analytics-worker
      dockerfile: Dockerfile
    command: python src/main.py
    depends_on:
      - db
      - redis

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: secret
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  pgdata:
